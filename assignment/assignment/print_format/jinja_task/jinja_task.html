<h3>Product List</h3>

<p>
    Minimum Price: <b><%= filters.min_price || "All" %></b>
</p>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>Product Name</th>
            <th>Product Code</th>
            <th>Category</th>
            <th>Price</th>
        </tr>
    </thead>

    <tbody>
        <% for (var i = 0; i < data.length; i++) { %>
            <tr>
                <td><%= data[i].product_name %></td>
                <td><%= data[i].product_code %></td>
                <td><%= data[i].category %></td>
                <td><%= data[i].price %></td>
            </tr>
        <% } %>
    </tbody>
</table>
